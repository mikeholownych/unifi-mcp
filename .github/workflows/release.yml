name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@v6.1.0

      - name: Set up Python
        run: uv python install 3.13

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI (trusted publishing)
        run: uv publish
        # Uses PyPI trusted publishing via GitHub OIDC (id-token: write above).
        # A PyPI trusted publisher must be configured for this repo/workflow.
        # To fall back to a token, set PYPI_API_TOKEN and pass `--token
        # "$PYPI_API_TOKEN"` (uv publish also reads PYPI_TOKEN).
